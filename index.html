<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>Liam Gillies</h1>
        <div class="header-divider"></div>
        <nav class="tab-bar" aria-label="Primary">
          <a class="tab-item active" href="#home">Home</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="showreel">
        <div class="showreel__content">
          <p class="eyebrow">Featured</p>
          <h2>Showreel</h2>
          <p></p>
        </div>
        <div class="showreel__video">
          <video controls poster="thumbnail.png" width="100%">
            <source src="Showreel v1.mp4" type="video/mp4" />
            Your browser doesn’t support HTML5 video.
          </video>
        </div>
      </section>

      <section class="projects">
        <p class="eyebrow">Projects</p>
        <h2>Recent Projects</h2>
        <div class="project-list">
          <a
            class="project-card"
            href=""
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="Media/project3.png" alt="Project Three" />
            <div class="project-label">Cuppa Tasks (2026)</div>
          </a>
          <a
            class="project-card"
            href="https://example.com/project-two"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="Media/project2.png" alt="Project Two" />
            <div class="project-label">80 Years (2025)</div>
          </a>
          <a
            class="project-card"
            href="https://example.com/project-three"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="Media/project1.png" alt="Project One" />
            <div class="project-label">Unending Workshop (2025)</div>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
